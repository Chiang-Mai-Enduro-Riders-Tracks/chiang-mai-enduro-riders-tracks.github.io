<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chiang Mai Enduro Riders Tracks</title>
<meta name="description" content="Beginner-friendly enduro GPX routes around Chiang Mai, with notes and downloads.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111'/%3E%3Cpath d='M5 24 L12 12 L17 19 L21 14 L27 24 Z' fill='%23f5a524'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=ef0bdf35">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 id="title">Chiang Mai Enduro Riders Tracks</h1>
    <p id="subtitle" class="muted"></p>
  </div>
  <a class="btn" id="zipAll" href="gpx/all-tracks.zip" download>Download all GPX</a>
</header>

<main class="layout">
  <section class="mapwrap">
    <div id="map" role="region" aria-label="Map of the tracks"></div>
    <div id="profile" hidden></div>
  </section>

  <aside class="panel">
    <div id="overview">
      <a class="back" id="toMain" href="#" hidden>← Easy enduro tracks</a>
      <div class="notice">
        <p id="intro"></p>
        <p id="restricted" class="strong"></p>
      </div>
      <details class="rules" id="rules">
        <summary id="rulesSummary">Read before riding</summary>
        <div id="rulesBody"></div>
      </details>
      <h2 class="section" id="listHead">Tracks</h2>
      <ol id="list" class="list"></ol>
      <h2 class="section" id="changesHead">Recent updates</h2>
      <ul id="changes" class="changes"></ul>
      <p id="contribute" class="muted small"></p>
    </div>
    <article id="detail" hidden></article>
  </aside>
</main>

<script src="vendor/leaflet.min.js"></script>
<script src="common.js?v=68463d85"></script>
<script src="app.js?v=18cd552c"></script>
</body>
</html>
