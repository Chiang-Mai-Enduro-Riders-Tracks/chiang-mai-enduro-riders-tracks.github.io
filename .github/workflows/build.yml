# Rebuilds docs/ whenever a track, NOTES.txt or the site code changes, and commits it back.
# GitHub Pages serves docs/ straight from the main branch, so the last good build keeps
# serving even if this workflow ever stops working.
name: Build site

on:
  push:
    branches: [main]
    paths: ["tracks/**", "site/**", "build.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 build.py
      - name: Commit docs/
        run: |
          git config user.name "site-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Rebuild site"
          git push
