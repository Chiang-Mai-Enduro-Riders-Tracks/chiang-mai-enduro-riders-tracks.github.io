<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Gaia Link Test</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display: block; }
  .t { display: block; width: 100%; margin: 10px 0; text-align: left; padding: 14px; font-size: 16px; }
  .t small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .t.fail { border-color: var(--warn); }
  .t.fail::after { content: " ❌ didn't open"; color: var(--warn); }
</style>
</head>
<body>
<div class="page">
  <h1 style="font-size:20px">Gaia link test (temporary)</h1>
  <p class="muted small">Tap each button on the Android phone. If Gaia opens, note the letter and whether the track imported, then come back to Chrome.
    If it didn't work, this page comes back with ❌ on that button.</p>
  <div id="list"></div>
  <button class="btn" id="reset" style="margin-top:16px">Clear ❌ marks</button>
</div>
<script>
  const PKG = "com.trailbehind.android.gaiagps.pro";
  const gpx = new URL("gpx/01-1of5-Mae-Rim-North.gpx", location.href);
  const path = gpx.host + gpx.pathname;
  const back = k => encodeURIComponent(location.origin + location.pathname + "?fail=" + k);
  const T = [
    ["A", "Just open Gaia (checks the app can be reached at all)",
      k => `intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=${PKG};S.browser_fallback_url=${back(k)};end`],
    ["B", "View link, GPX type (what the button does now)",
      k => `intent://${path}#Intent;scheme=https;action=android.intent.action.VIEW;type=application/gpx+xml;package=${PKG};S.browser_fallback_url=${back(k)};end`],
    ["C", "View link, no type",
      k => `intent://${path}#Intent;scheme=https;action=android.intent.action.VIEW;package=${PKG};S.browser_fallback_url=${back(k)};end`],
    ["D", "View link, octet-stream type",
      k => `intent://${path}#Intent;scheme=https;action=android.intent.action.VIEW;type=application/octet-stream;package=${PKG};S.browser_fallback_url=${back(k)};end`],
    ["E", "View link, text/xml type",
      k => `intent://${path}#Intent;scheme=https;action=android.intent.action.VIEW;type=text/xml;package=${PKG};S.browser_fallback_url=${back(k)};end`],
    ["F", "View link, application/xml type",
      k => `intent://${path}#Intent;scheme=https;action=android.intent.action.VIEW;type=application/xml;package=${PKG};S.browser_fallback_url=${back(k)};end`],
    ["G", "Share the link to Gaia (like the Share button)",
      k => `intent:#Intent;action=android.intent.action.SEND;type=text/plain;S.android.intent.extra.TEXT=${encodeURIComponent(gpx.href)};package=${PKG};S.browser_fallback_url=${back(k)};end`],
    ["I", "Gaia's own website link (gaiagps.com): opens in the app?",
      k => `intent://www.gaiagps.com/#Intent;scheme=https;action=android.intent.action.VIEW;package=${PKG};S.browser_fallback_url=${back(k)};end`],
    ["J", "Gaia's own app address (gaiagps://)",
      k => `intent://open#Intent;scheme=gaiagps;action=android.intent.action.VIEW;package=${PKG};S.browser_fallback_url=${back(k)};end`],
    ["H", "No app named: does Android offer Gaia in the list?",
      k => `intent://${path}#Intent;scheme=https;action=android.intent.action.VIEW;type=application/gpx+xml;S.browser_fallback_url=${back(k)};end`],
  ];
  let fails = [];
  try { fails = JSON.parse(localStorage.getItem("gaiaFails") || "[]"); } catch {}
  const f = new URLSearchParams(location.search).get("fail");
  if (f && !fails.includes(f)) fails.push(f);
  try { localStorage.setItem("gaiaFails", JSON.stringify(fails)); } catch {}
  if (f) history.replaceState(null, "", location.pathname);
  document.getElementById("list").innerHTML = T.map(([k, label, fn]) =>
    `<a class="btn t ${fails.includes(k) ? "fail" : ""}" href="${fn(k)}">${k}. ${label}<small>${k === "H" ? "If a list of apps appears, is Gaia GPS in it?" : "Opens Gaia?"}</small></a>`).join("");
  document.getElementById("reset").onclick = () => { try { localStorage.removeItem("gaiaFails"); } catch {} location.reload(); };
</script>
</body>
</html>
